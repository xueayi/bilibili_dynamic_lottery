server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # PHP API 入口 - 使用 ^~ 前缀匹配，优先级高于正则
    # 前端 VITE_API_ROOT_URL 指向 /api/index.php
    location ^~ /api/ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/index.php;
        fastcgi_read_timeout 10800s;
        fastcgi_send_timeout 10800s;
        fastcgi_connect_timeout 60s;
    }

    # SPA 路由回退 - 所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
